name: CD

on:
  push:
    branches: [develop]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.EC2_USERNAME }}/app

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          MUSIC_API_BASE_URL: ${{ secrets.MUSIC_API_BASE_URL }}
          MUSIC_API_KEY: ${{ secrets.MUSIC_API_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_IMAGE,DB_PASSWORD,JWT_SECRET,AWS_ACCESS_KEY,AWS_SECRET_KEY,AWS_S3_BUCKET,MUSIC_API_BASE_URL,MUSIC_API_KEY,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd ~/app
            umask 077
            printf '%s\n' \
              "BACKEND_IMAGE=$BACKEND_IMAGE" \
              "DB_USERNAME=root" \
              "DB_PASSWORD=$DB_PASSWORD" \
              "JWT_SECRET=$JWT_SECRET" \
              "AWS_ACCESS_KEY=$AWS_ACCESS_KEY" \
              "AWS_SECRET_KEY=$AWS_SECRET_KEY" \
              "AWS_S3_BUCKET=$AWS_S3_BUCKET" \
              "MUSIC_API_BASE_URL=$MUSIC_API_BASE_URL" \
              "MUSIC_API_KEY=$MUSIC_API_KEY" > .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull backend
            docker compose up -d --no-build
            docker logout ghcr.io
            docker image prune -f
