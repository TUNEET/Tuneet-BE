spring:
  application:
    name: tuneet-be

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/tuneet_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000
  refresh-token-expiration: 1209600000

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173